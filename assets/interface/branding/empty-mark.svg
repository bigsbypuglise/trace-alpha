<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    THE EMPTY-STATE PRISM MARK. Taken from the 260817 UI v2 design package's own
    empty-state mockup, assets/source/260817-trace-ui-v2/Trace-App-Mockups.html,
    section id="screen-3", which is the markup behind the delivered
    mockups/03-empty-state.png.

    IT IS NOT trace-play-mark.svg. That one is the app-icon mark, and reaching
    for it because the names are close would put subtly different art on screen:
    scale 1.9 rather than 1.7, a two-tone cyan/violet edge rather than the
    five-stop prism, edge stroke 9 rather than 11, glow opacity 0.3 rather than
    0.42, specular opacity 0.7 rather than 0.6.

    TWO VALUES ARE PHASE, NOT DESIGN, and they are set so that t=0 is the frame
    the delivered mockup shows. The package's mockup is a browser screenshot
    taken partway through an 18s loop, so its still and its own t=0 do not
    match; the animation start is rotated to 150 degrees and the two animated
    glow stops carry their own values[0] as their static colour, which makes the
    still, the t=0 of the animation and the delivered PNG one thing rather than
    three. Measured against the mockup crop composited over its #050506
    background: mean absolute channel delta 0.67, max 39, over the delivered
    art's own 1.82 / 71 at the unrotated phase.

    THE SMIL IS KEPT AND NOTHING PLAYS IT. Trace does not link Qt6::Svg and the
    .qrc embeds no SVGs, so the PNG renditions beside this file are what ships
    and this is the master they are rendered from. It is kept because it is the
    delivered design and because a future idle-animation commit is built from
    these stops and this duration, not from a new invention.

    Note for whoever edits this file: XML forbids a double hyphen inside a
    comment, and resvg enforces that where some renderers do not.
  -->
  <defs>
    <linearGradient id="emBody" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2E4E58"/>
      <stop offset="0.5" stop-color="#2A3A50"/>
      <stop offset="1" stop-color="#3A2E48"/>
    </linearGradient>
    <linearGradient id="emRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="emSpec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="emEdge" gradientUnits="userSpaceOnUse"
                    gradientTransform="rotate(150 520 512)"
                    x1="300" y1="300" x2="740" y2="740">
      <stop offset="0" stop-color="#5AC8E8"/>
      <stop offset="0.25" stop-color="#5B8DEF"/>
      <stop offset="0.5" stop-color="#8B6FE8"/>
      <stop offset="0.75" stop-color="#D46FB8"/>
      <stop offset="1" stop-color="#5AC8E8"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
                        from="150 520 512" to="510 520 512"
                        dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="emGlow" gradientUnits="userSpaceOnUse" cx="520" cy="560" r="300">
      <stop offset="0" stop-color="#5AC8E8" stop-opacity="0.42">
        <animate attributeName="stop-color" values="#5AC8E8;#5B8DEF;#8B6FE8;#D46FB8;#5AC8E8"
                 dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.6" stop-color="#4FBEE8" stop-opacity="0.16">
        <animate attributeName="stop-color" values="#4FBEE8;#6F8FE0;#9F7FD8;#D48FC0;#4FBEE8"
                 dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#6FA8D8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(520 512) scale(1.7) translate(-520 -512)">
    <path d="M420 336 L720 512 L420 688 Z" fill="url(#emBody)" stroke="url(#emBody)"
          stroke-width="40" stroke-linejoin="round"/>
    <path d="M420 336 L720 512 L420 688 Z" fill="none" stroke="url(#emRim)"
          stroke-width="40" stroke-linejoin="round"/>
    <path d="M420 336 L720 512 L420 688 Z" fill="url(#emGlow)" stroke="url(#emGlow)"
          stroke-width="40" stroke-linejoin="round" opacity="0.9" style="mix-blend-mode:screen"/>
    <path d="M452 388 L672 512 L452 636 Z" fill="none" stroke="url(#emEdge)"
          stroke-width="11" stroke-linejoin="round" opacity="0.9" style="mix-blend-mode:screen"/>
    <path d="M430 352 L604 454" stroke="url(#emSpec)" stroke-width="9"
          stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
