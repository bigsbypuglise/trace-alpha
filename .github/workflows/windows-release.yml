name: Windows CI + Alpha Release

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

# Superseded runs on the same branch are pointless once a newer push lands,
# and Windows runners bill at 2x. Cancel them (but never a tag/release run).
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Bump this string to force a rebuild of the cached FFmpeg/vcpkg tree.
  # v2 (Aug 2026): the v1 cache still held FFmpeg 7.x (avcodec-61) while local
  # dev builds resolve to 8.x, so perf numbers measured locally could not be
  # compared against the shipping build. Bumping forces a rebuild onto the
  # current vcpkg ffmpeg port. Note this pins the *cache*, not the version:
  # vcpkg is cloned unpinned below, so a future cache miss can still drift.
  # Pin a vcpkg baseline commit if exact reproducibility becomes necessary.
  VCPKG_CACHE_VERSION: v2

jobs:
  build-windows:
    name: Build Windows (VS2022, Qt6, FFmpeg)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # qtmultimedia supplies QAudioSink for audio output. Without it CMake
      # builds a silent Trace rather than failing, so the verify step below
      # asserts the DLL actually shipped.
      - name: Install Qt 6 (Widgets + imageformats + multimedia)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          modules: "qtimageformats qtmultimedia"
          cache: true

      # FFmpeg is compiled from source by vcpkg and dominates build time.
      # Cache the whole vcpkg tree so only the first build after a cache miss
      # pays that cost. Cache entries expire after 7 days idle.
      - name: Restore vcpkg + FFmpeg cache
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg
          key: vcpkg-${{ env.VCPKG_CACHE_VERSION }}-windows-2022-ffmpeg-x64

      - name: Install vcpkg + FFmpeg (only on cache miss)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ge 7) { $PSNativeCommandUseErrorActionPreference = $true }

          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed ($LASTEXITCODE)" }

          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install ffmpeg:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install ffmpeg failed ($LASTEXITCODE)" }

      - name: Resolve build tools and dependency paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

          $qtRoot = $env:QT_ROOT_DIR
          if (-not $qtRoot -or -not (Test-Path $qtRoot)) {
            throw "QT_ROOT_DIR is missing; Qt install did not complete correctly."
          }

          $windeployqt = Join-Path $qtRoot "bin\windeployqt.exe"
          if (-not (Test-Path $windeployqt)) {
            throw "windeployqt.exe not found at expected path: $windeployqt"
          }

          $ffmpegBin = Join-Path "$env:RUNNER_TEMP\vcpkg" "installed\x64-windows\bin"
          if (-not (Test-Path $ffmpegBin)) {
            throw "FFmpeg runtime bin not found: $ffmpegBin (cache may be corrupt - bump VCPKG_CACHE_VERSION)"
          }

          "WINDEPLOYQT=$windeployqt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FFMPEG_BIN=$ffmpegBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure CMake (Release, VS2022 x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed ($LASTEXITCODE)" }

      # Fail loudly if FFmpeg wasn't detected: the app compiles without it but
      # cannot play video, which is not a build worth shipping for testing.
      - name: Verify FFmpeg was found by CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Get-Content "build\CMakeCache.txt" -Raw
          if ($cache -notmatch 'FFMPEG_AVCODEC_LIBRARY:FILEPATH=(?!.*NOTFOUND)') {
            throw "FFmpeg was not found during configure - the build would have no video playback."
          }
          Write-Host "FFmpeg detected by CMake."

          # Audio degrades silently to a picture-only build, so assert both
          # halves of it were found rather than discovering it on the desktop.
          if ($cache -notmatch 'FFMPEG_SWRESAMPLE_LIBRARY:FILEPATH=(?!.*NOTFOUND)') {
            throw "swresample was not found during configure - the build would have no audio."
          }
          if ($cache -notmatch 'Qt6Multimedia_DIR:PATH=(?!.*NOTFOUND)') {
            throw "Qt6 Multimedia was not found during configure - the build would have no audio."
          }
          Write-Host "Audio dependencies detected by CMake."

      - name: Build Trace target (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --target Trace --parallel
          if ($LASTEXITCODE -ne 0) { throw "Build failed ($LASTEXITCODE)" }

      - name: Package portable app folder (Trace + Qt + runtime DLLs)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ge 7) { $PSNativeCommandUseErrorActionPreference = $true }

          $exe = Join-Path $PWD "build\app\Release\Trace.exe"
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem "$PWD\build" -Recurse -Filter Trace.exe | Select-Object -First 1 | ForEach-Object { $_.FullName }
          }
          if (-not $exe) {
            throw "Trace.exe not found after build."
          }

          $distRoot = Join-Path $PWD "dist"
          $dist = Join-Path $distRoot "trace-alpha-windows-x64"

          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item $exe (Join-Path $dist "Trace.exe") -Force

          # windeployqt copies the Qt DLLs and the platform plugin next to the
          # exe. Its exit code was previously ignored, so a failure here shipped
          # an exe that could not start.
          & "$env:WINDEPLOYQT" --release --compiler-runtime (Join-Path $dist "Trace.exe")
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed ($LASTEXITCODE) - Qt runtime would be missing" }

          # FFmpeg DLLs are required when TRACE_WITH_FFMPEG is enabled.
          Copy-Item (Join-Path $env:FFMPEG_BIN "*.dll") $dist -Force

      # A green build must mean a build that actually starts on Anj's box.
      # Assert every runtime piece is present before publishing anything.
      - name: Verify package is launchable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD "dist\trace-alpha-windows-x64"

          $required = @(
            "Trace.exe",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "Qt6Multimedia.dll",
            "platforms\qwindows.dll"
          )

          $missing = @()
          foreach ($item in $required) {
            if (-not (Test-Path (Join-Path $dist $item))) { $missing += $item }
          }

          # FFmpeg DLL names carry version suffixes (avcodec-62.dll on 8.x),
          # so match by prefix rather than pinning a soname here.
          foreach ($lib in @("avcodec", "avformat", "avutil", "swscale", "swresample")) {
            if (-not (Get-ChildItem $dist -Filter "$lib*.dll" -ErrorAction SilentlyContinue)) {
              $missing += "$lib*.dll"
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "--- package contents ---"
            Get-ChildItem $dist -Recurse | Select-Object -ExpandProperty FullName
            throw "Package is missing required runtime files: $($missing -join ', ')"
          }

          $sizeMb = [math]::Round(((Get-ChildItem $dist -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB), 1)
          Write-Host "Package verified: $($required.Count) required files present, $sizeMb MB total."

      # Files existing is not the same as the app working, and since 2026-08-10
      # d3d11 is the DEFAULT renderer -- so a build whose GPU backend fails to
      # initialize would go green and every user would silently land on the CPU
      # fallback. That is the exact failure the renderer boundary was built to
      # make visible (plan section 12), and plan section 5 asked for this check
      # by name.
      #
      # Runners have no GPU. The backend retries on WARP for that reason, so
      # "d3d11 (warp)" is a pass and the prefix match accepts it. What fails is a
      # backend that was requested and could not initialize (exit 3), or one that
      # never got built because fxc was missing (exit 4) -- the second is why
      # there is no separate configure-time check for the shader compiler.
      #
      # Runs against the DEPLOYED folder, not the build tree, so it also proves
      # the packaged exe starts with the Qt runtime windeployqt actually shipped.
      - name: Verify the renderer initializes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD "dist\trace-alpha-windows-x64\Trace.exe"

          $out = & $exe --renderer-selftest=d3d11 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }

          if ($code -ne 0) {
            throw "Renderer self-test failed (exit $code). See the line above."
          }

          # A failed YUV shader is deliberately non-fatal at runtime (GATE C):
          # the backend keeps presenting BGRA and nothing else would say the
          # shader path was lost. That makes it exactly the kind of silent
          # degradation this step exists to catch, so CI asserts it even though
          # the app tolerates it.
          #
          # Asserted only after a run showed it: b5ad4d2 read
          # `renderer=d3d11 fellback=0 planar=1` on a GitHub runner. Before that
          # it was printed rather than checked, because whether the runner's
          # device supplies ps_4_0 had never been observed and guessing would
          # have turned the first run red on a guess.
          if ($out -notmatch 'planar=1') {
            throw "Renderer self-test reports planar=0 - the GATE C YUV shader path did not build, so every frame would take the BGRA fallback."
          }

      # Uploaded as a FOLDER, not a .zip. upload-artifact always zips what it
      # is given, so uploading a zip produced a zip-inside-a-zip: unzipping the
      # download left another archive instead of the app.
      - name: Upload workflow artifact (every push/tag)
        uses: actions/upload-artifact@v4
        with:
          name: trace-alpha-windows-x64
          path: dist/trace-alpha-windows-x64/**
          if-no-files-found: error

      # Release assets are downloaded directly (not re-zipped by GitHub), so
      # the Releases page gets a real single zip.
      - name: Create release ZIP (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path "dist\trace-alpha-windows-x64\*" -DestinationPath "dist\trace-alpha-windows-x64.zip" -Force

      - name: Publish/Update versioned prerelease asset (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/trace-alpha-windows-x64.zip
